[project]
name = "mms-print-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1", "pydantic-settings>=2.6,<3"]

[project.optional-dependencies]
windows = ["pywin32>=308"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1", "pyright>=1.1.390", "pyinstaller>=6,<7"]

[project.scripts]
mms-print-agent = "mms_print_agent.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mms_print_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.pyright]
include = ["mms_print_agent"]
reportMissingImports = false
