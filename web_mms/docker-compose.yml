services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mms
      POSTGRES_USER: mms
      POSTGRES_PASSWORD: mms
    ports:
      - "5432:5432"
    volumes:
      - mms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mms -d mms"]
      interval: 5s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    environment:
      MMS_DATABASE_URL: postgresql+psycopg://mms:mms@db:5432/mms
      MMS_SECRET_KEY: local-docker-development-key
      MMS_CORS_ORIGINS: http://localhost:5173
      MMS_PRINT_TRANSPORT_ENABLED: "false"
      MMS_PRINT_ARTIFACT_ROOT: /runtime/print_artifacts
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - mms_print_artifacts:/runtime/print_artifacts
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --reload"

volumes:
  mms_postgres:
  mms_print_artifacts:
