name: MMS Web CI

on:
  push:
    branches: ["web-platform*"]
    paths: ["web_mms/**", ".github/workflows/web-mms-ci.yml"]
  pull_request:
    paths: ["web_mms/**", ".github/workflows/web-mms-ci.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mms_test
          POSTGRES_USER: mms
          POSTGRES_PASSWORD: mms
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mms -d mms_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: web_mms/backend
    env:
      MMS_DATABASE_URL: postgresql+psycopg://mms:mms@localhost:5432/mms_test
      MMS_SECRET_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: "pip" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -e ".[dev]"
      - name: Migration smoke test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - run: pytest -q
      - run: ruff check app tests
      - run: npx --yes pyright app tests alembic

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web_mms/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "npm", cache-dependency-path: web_mms/frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
